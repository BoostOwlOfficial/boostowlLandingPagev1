<!--
  BoostOwl — standard <head> block. REFERENCE ONLY (this file is never served or loaded).

  The site has no shared header or template, so EVERY new page needs its own copy.
  Paste the block below into the page's <head>, right after <meta name="viewport" ...>
  and before <title>. Without it the page is untracked and shows no favicon.

  Then add the new URL to /sitemap.xml.

  Analytics:  Google Analytics 4 (G-1V2XBVV7WB) + Microsoft Clarity (xrwvfcen0b)
  Pages that already have it: index.html, blog.html, post.html, 404.html,
                              legal/privacy.html, legal/terms.html, legal/data-deletion.html
-->

<!-- Google Analytics 4 (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1V2XBVV7WB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-1V2XBVV7WB');
</script>
<!-- Microsoft Clarity -->
<script type="text/javascript">
  (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
  })(window, document, "clarity", "script", "xrwvfcen0b");
</script>

<link rel="icon" href="/favicon.ico" sizes="32x32">
